<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLB Scoreboard — ErrorsLive</title>
  <meta name="description" content="All-games MLB scoreboard from the public MLB StatsAPI, paired with a focused official scoring-errors feed.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%23e03131' stroke-width='6'/%3E%3Cpath d='M50 4 A46 46 0 0 1 96 50 M50 96 A46 46 0 0 1 4 50 M4 50 A46 46 0 0 1 50 4 M96 50 A46 46 0 0 1 50 96' stroke='%23e03131' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
  <!-- Open the data host while the stylesheet is still parsing: each page's
       first request is a cross-origin call to statsapi.mlb.com (assets/js/api.js),
       and preconnect removes that DNS + TCP + TLS setup (one connection setup;
       standard preconnect behaviour, not a figure measured here) from the
       critical path of the first poll. The two
       image hosts are only dns-prefetched — they are lazy-loaded logos and
       headshots off the critical path, so an extra connection would cost more
       than it saves. Ignored by browsers without support; harmless otherwise. -->
  <link rel="preconnect" href="https://statsapi.mlb.com" crossorigin>
  <link rel="dns-prefetch" href="https://statsapi.mlb.com">
  <link rel="dns-prefetch" href="https://www.mlbstatic.com">
  <link rel="dns-prefetch" href="https://img.mlbstatic.com">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-scoreboard">
  <header class="topbar">
    <div class="brand">
      <span class="brand-ball">⚾</span>
      <span>ErrorsLive</span>
      <span class="brand-sub">MLB scoreboard</span>
    </div>
    <a class="btn btn-feed" href="reviews.html" title="Only official field errors and primary scoring-pending rulings">✏️ Errors + pending</a>
    <div class="date-nav">
      <button class="btn btn-ghost" onclick="Scoreboard.prevDay()" title="Previous day">←</button>
      <input type="date" id="date-picker" onchange="Scoreboard.pickDate()" aria-label="Game date">
      <button class="btn btn-ghost" onclick="Scoreboard.nextDay()" title="Next day">→</button>
      <button class="btn" onclick="Scoreboard.today()">Today</button>
    </div>
    <div id="date-label" class="date-label"></div>
  </header>

  <p class="integration-nav"><a href="../index.html">← ErrorsLive home</a> · <a href="reviews.html">Errors + official scoring pending</a></p>
  <div id="banner" class="banner"></div>
  <nav id="tabs" class="tabs" aria-label="Filter games"></nav>

  <main id="game-list" class="game-list"></main>

  <div id="status-line" class="status-line"></div>

  <footer class="site-footer">
    <p>
      Unofficial fan project. Data via the public MLB StatsAPI
      (<a href="https://statsapi.mlb.com" target="_blank" rel="noopener">statsapi.mlb.com</a>) —
      the same feeds that power <a href="https://www.mlb.com" target="_blank" rel="noopener">MLB.com</a> Gameday.
      Not affiliated with MLB or MLB Advanced Media.
    </p>
  </footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/scoreboard.js"></script>
</body>
</html>
