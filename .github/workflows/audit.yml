name: audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Rebuild every published artifact from source
        # Derived tables must be byte-identical; the fitted model is compared numerically, because a
        # solver's last digits follow the BLAS build it was linked against (see tools/check_repro.py).
        # Failures are reported as GitHub annotations, which stay readable through the REST API even
        # when the job log download is broken.
        run: |
          python3 tools/run_all.py
          python3 tools/check_repro.py --ref HEAD
      - name: Audit suite (numbers vs pages, site vs tool, official ledger)
        run: python3 tests/test_pipeline.py
      - name: Live scorer runs against the committed official feed capture
        run: python3 tools/live_score.py --feed data/source/feed_823441.json --quiet --json /tmp/live.json
