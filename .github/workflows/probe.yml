name: probe

# The offline build sandbox has no outbound route to MLB endpoints, so collection runs here and only
# the *derived evidence* is committed (data/ingest/probe_report.json), which keeps the build
# reproducible while making the observation auditable in the repository. Log download through the
# API is unreliable from some clients, hence the commit-back rather than an artifact step.
on:
  push:
    branches: ['arena/**', 'main', 'ingest/**']
    paths: ['tools/probe_api.py', '.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe the official endpoints
        run: python3 tools/probe_api.py
      - name: Commit the probe report back to this branch
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ingest/probe_report.json
          if git diff --cached --quiet; then echo 'probe report unchanged'; exit 0; fi
          git commit -m "[ci-probe] official endpoint report $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA::7}"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            echo "push attempt $i failed; retrying"; sleep 8
          done
