name: ruling-watch

# Poll the small set of live games frequently; re-read the recent final-game window once daily to
# detect later changes without refetching hundreds of completed games every 15 minutes.
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/watch_rulings.py'
      - 'tools/build_site_data.py'
      - '.github/workflows/ruling-watch.yml'
      - 'docs/methods.html'

permissions:
  contents: write

concurrency:
  group: ruling-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Observe current live feeds
        if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
        run: python3 tools/watch_rulings.py --days 21 --active-only
        continue-on-error: true
      - name: Recheck the recent live/final window daily
        if: github.event_name == 'schedule' && github.event.schedule == '17 5 * * *'
        run: python3 tools/watch_rulings.py --days 21
        continue-on-error: true
      - name: Run a full watch after a manual dispatch or source update
        if: github.event_name != 'schedule'
        run: python3 tools/watch_rulings.py --days 21
        continue-on-error: true
      - name: Rebuild the public ruling-change table
        if: always()
        run: python3 tools/build_site_data.py
        continue-on-error: true
      - name: Commit changed observations, status and public data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in data/ingest/ruling_snapshot.csv data/ingest/ruling_changes.csv \
            data/ingest/ruling_watch_status.json docs/data/ruling_changes.json \
            docs/data/alerts.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo 'no observation changes'; exit 0; fi
          git commit -m "[ci-watch] update official ruling observations $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            if git fetch origin "$BRANCH" && git rebase "origin/$BRANCH"; then
              git push origin "HEAD:$BRANCH" && exit 0
            fi
            git rebase --abort || true
            sleep 8
          done
          echo '::warning::could not push ruling observations after retries'
          exit 1
